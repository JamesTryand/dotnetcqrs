# dotnetcqrs-multi-node Milestone 7 — a throwaway Postgres for the backend tests.
#
#   docker compose -f ops/postgres/compose.yml up -d      # or: podman compose ...
#   export DOTNETCQRS_PG="Host=localhost;Port=55432;Username=postgres;Password=dev;Database=postgres"
#   dotnet test --filter FullyQualifiedName~Postgres
#   docker compose -f ops/postgres/compose.yml down -v
#
# The tests need a privileged role (the default `postgres` superuser is fine): the
# write-guard test creates and drops throwaway LOGIN roles. Everything else runs inside
# per-test schemas that are dropped on teardown, so re-runs need no cleanup.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral: this DB holds nothing worth keeping
