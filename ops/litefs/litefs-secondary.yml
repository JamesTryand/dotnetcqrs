# Static-lease replica. Same file as litefs-primary.yml apart from `candidate: false`
# and which binary `exec` runs -- advertise-url still points at the primary (that's how
# a static-lease replica finds it; see litefs-primary.yml's comment), sourced the same
# way from $LITEFS_ADVERTISE_URL.
fuse:
  dir: "/litefs"

data:
  dir: "/var/lib/litefs"

lease:
  type: "static"
  advertise-url: "${LITEFS_ADVERTISE_URL}"
  candidate: false

exec:
  - cmd: "dotnet /app/MultiNode.Secondary.dll"
